[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "S", "BLE", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]          # asserts are the point of a test
"scripts/*" = ["S311"]        # the stand-in model's weights need no cryptographic rng
"app/page.py" = ["E501"]      # an HTML document in a string; rewrapping it helps nobody

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
