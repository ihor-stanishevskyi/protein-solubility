name: deploy

# Everything learned the hard way on the sibling project is already here:
#  - the build target is named, never inherited from stage order
#  - a public function URL needs BOTH lambda:InvokeFunctionUrl and
#    lambda:InvokeFunction, which Lambda states in the body of its own 403
#  - the token's claims are printed, because GitHub now sends a subject with
#    numeric ids that the AWS console wizard does not write
#  - a failed reply is kept, not discarded: curl -f throws away the one thing
#    worth reading

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FUNCTION: protein-solubility
  ECR_REPO: protein-solubility
  ROLE: arn:aws:iam::031391485774:role/protein-solubility-deploy
  WEIGHTS_BUCKET: protein-solubility-weights-031391485774

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: what identity is GitHub actually presenting
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("--- the subject the trust policy has to match ---")
          print(repr(c["sub"]))
          print("aud:", repr(c["aud"]))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - run: aws sts get-caller-identity

      - name: ensure the image repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - name: let the Lambda service pull from this repository
        run: |
          set -euo pipefail
          # Creating the function fails with "Lambda does not have permission
          # to access the ECR image" without this: the image is pulled by the
          # service, not by the role that pushed it. Scoped to functions in
          # this account, so the repository is not readable by anyone else.
          aws ecr set-repository-policy --repository-name "$ECR_REPO" \
            --policy-text "$(cat <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "LambdaPull",
              "Effect": "Allow",
              "Principal": {"Service": "lambda.amazonaws.com"},
              "Action": ["ecr:BatchGetImage", "ecr:GetDownloadUrlForLayer"],
              "Condition": {"StringLike": {
                "aws:sourceArn": "arn:aws:lambda:us-east-1:031391485774:function:*"}}
            }]
          }
          JSON
          )" >/dev/null
          echo "the Lambda service may now pull this image"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # Either the trained weights are in the bucket and go into the image, or
      # they are not and the stand-in does. Which of the two happened is stated
      # in the log and in the job summary - never decided quietly.
      - name: take the trained weights if they have been uploaded
        id: weights
        run: |
          set -euo pipefail
          mkdir -p build-weights
          # ListBucket is granted precisely so a missing key reads as missing
          # rather than as forbidden. Without it S3 answers 403 for both.
          if ! FOUND=$(aws s3api list-objects-v2 --bucket "$WEIGHTS_BUCKET" \
                         --prefix model.onnx --query 'length(Contents)' --output text 2>&1); then
            # No bucket yet means the infrastructure update has not been applied,
            # which is a known waypoint, not a broken deploy. Anything else -
            # above all AccessDenied - is a real fault and must not be papered
            # over by quietly shipping the stand-in.
            case "$FOUND" in
              *NoSuchBucket*)
                echo "::warning::s3://$WEIGHTS_BUCKET does not exist yet - stand-in it is."
                FOUND=0 ;;
              *) echo "::error::could not list s3://$WEIGHTS_BUCKET - $FOUND"; exit 1 ;;
            esac
          fi

          if [ "$FOUND" = "None" ] || [ "$FOUND" = "0" ]; then
            echo "kind=stand-in" >> "$GITHUB_OUTPUT"
            echo "No model.onnx in s3://$WEIGHTS_BUCKET - deploying the stand-in."
            echo "### Deployed the STAND-IN" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`model.onnx\` in \`s3://$WEIGHTS_BUCKET\`. The service will" \
                 "say its answers mean nothing, because they do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for f in model.onnx vocab.json metrics.json; do
            aws s3 cp "s3://$WEIGHTS_BUCKET/$f" "build-weights/$f" --no-progress
          done
          ls -l build-weights

          # The card is built from the measurements, never written by hand.
          python3 scripts/build_card.py build-weights/metrics.json \
                  build-weights/model.card.json \
                  --measured "$(date -u +%Y-%m-%d)"

          python3 - <<'PY'
          import json, os, pathlib
          card = json.loads(pathlib.Path("build-weights/model.card.json").read_text())
          hollow = card["answers_mean_nothing"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"kind={'incomplete' if hollow else 'trained'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              if hollow:
                  fh.write("### Weights uploaded, but their measurements are incomplete\n")
                  fh.write("The service will keep saying its answers mean nothing.\n")
              else:
                  fh.write("### Deployed the TRAINED model\n")
                  fh.write(f"MCC {card['mcc']}, AUROC {card['auroc']} "
                           f"on {card['measured_on']}.\n")
          print(json.dumps(card, indent=2))
          PY

      # A 140 MB download can arrive truncated, and an ONNX graph exported with
      # the wrong alphabet scores every sequence on the wrong residues without
      # looking broken. Both are cheaper to find here than in production, and
      # the check is the service's own loading code, not an imitation of it.
      - name: make the weights prove themselves before they are shipped
        if: steps.weights.outputs.kind != 'stand-in'
        run: |
          set -euo pipefail
          pip install --quiet -r requirements.txt
          cp build-weights/vocab.json      app/vocab.json
          cp build-weights/model.onnx      app/_check.onnx
          cp build-weights/model.card.json app/_check.card.json
          MODEL_PATH=app/_check.onnx python3 - <<'PY'
          from app.model import predictor
          p = predictor()
          print("alphabet:", p.tok.size, "| vocabulary verified:", p.vocab_verified)
          assert p.vocab_verified, "the alphabet does not match the model"
          probs = p.predict(["MKTVRQERLKSIVRILERSKEPVSGAQ", "MKTV"])
          print("probabilities:", probs)
          assert all(0.0 <= x <= 1.0 for x in probs), probs
          assert probs[0] != probs[1], "the model returns the same number for different proteins"
          print("card:", p.card["name"], "| MCC", p.card["mcc"])
          PY
          git checkout -- app/vocab.json
          rm app/_check.onnx app/_check.card.json

      - name: build and push the Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lambda          # named, not inherited
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          build-args: |
            MODEL_SOURCE=${{ steps.weights.outputs.kind == 'stand-in' && 'models/stand-in.onnx' || 'build-weights/model.onnx' }}
            MODEL_CARD=${{ steps.weights.outputs.kind == 'stand-in' && 'models/stand-in.card.json' || 'build-weights/model.card.json' }}
            MODEL_VOCAB=${{ steps.weights.outputs.kind == 'stand-in' && 'app/vocab.json' || 'build-weights/vocab.json' }}

      - name: create or update the function
        id: fn
        run: |
          set -euo pipefail
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          if aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            echo "updating existing function"
            aws lambda update-function-code --function-name "$FUNCTION" \
              --image-uri "$IMAGE" >/dev/null
          else
            echo "creating the function"
            aws lambda create-function --function-name "$FUNCTION" \
              --package-type Image --code ImageUri="$IMAGE" \
              --role arn:aws:iam::031391485774:role/protein-solubility-lambda-exec \
              --timeout 30 --memory-size 2048 \
              --description "Protein solubility, fine-tuned ESM-2 35M on ONNX Runtime" >/dev/null
          fi
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: a public URL needs both invoke permissions
        id: url
        run: |
          set -euo pipefail
          if aws lambda get-function-url-config --function-name "$FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-url-config --function-name "$FUNCTION" \
              --auth-type NONE >/dev/null
          else
            aws lambda create-function-url-config --function-name "$FUNCTION" \
              --auth-type NONE >/dev/null
          fi
          # Lambda says the rule in the body of its own 403: a function URL
          # needs lambda:InvokeFunctionUrl AND lambda:InvokeFunction. Nearly
          # every guide shows only the first, and the policy then looks
          # textbook and refuses every request.
          for A in InvokeFunctionUrl InvokeFunction; do
            # The condition is accepted on InvokeFunctionUrl only.
            EXTRA=""
            [ "$A" = "InvokeFunctionUrl" ] && EXTRA="--function-url-auth-type NONE"
            if ERR=$(aws lambda add-permission --function-name "$FUNCTION" \
                       --statement-id "public-url-$A" --action "lambda:$A" \
                       --principal '*' $EXTRA 2>&1 >/dev/null); then
              echo "granted lambda:$A"
            elif printf '%s' "$ERR" | grep -q ResourceConflictException; then
              echo "lambda:$A already granted"
            else
              echo "$ERR"; exit 1
            fi
          done
          AUTH=$(aws lambda get-function-url-config --function-name "$FUNCTION" \
                   --query AuthType --output text)
          test "$AUTH" = "NONE"
          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION" \
                  --query FunctionUrl --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL"

      - name: watch it, so a broken deploy is noticed without being watched
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-alarm \
            --alarm-name "${FUNCTION}-errors" \
            --alarm-description "Any error from ${FUNCTION} in a 5 minute window" \
            --namespace AWS/Lambda --metric-name Errors --statistic Sum \
            --dimensions Name=FunctionName,Value="$FUNCTION" \
            --period 300 --evaluation-periods 1 --threshold 1 \
            --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data notBreaching
          echo "alarm ${FUNCTION}-errors is in place"

      - name: prove the deployed function answers, and answers sensibly
        run: |
          set -euo pipefail
          URL="${{ steps.url.outputs.url }}"
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o health.json -D headers.txt -w '%{http_code}' "${URL}health" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: HTTP $CODE"; sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "--- headers ---"; cat headers.txt
            echo "--- body ---"; cat health.json; echo
            exit 1
          fi
          cat health.json; echo
          python3 - "$URL" "${{ steps.weights.outputs.kind }}" <<'PY'
          import json, sys, urllib.request
          url, expected = sys.argv[1], sys.argv[2]
          h = json.load(urllib.request.urlopen(url + "health", timeout=30))
          assert h["status"] == "ok", h
          # The guard has to be live out here, not only in the test suite.
          assert h["vocabulary_checked_against_model"] is True, h

          req = urllib.request.Request(
              url + "predict",
              data=json.dumps({"sequences": ["MKTVRQERLKSIVRILERSKEPVSGAQ", "MKTV"]}).encode(),
              headers={"content-type": "application/json"})
          body = json.load(urllib.request.urlopen(req, timeout=60))
          rs = body["results"]
          assert len(rs) == 2, rs
          assert all(0.0 <= r["probability_soluble"] <= 1.0 for r in rs), rs
          # The card travels with the weights, so whatever is loaded, the
          # answer states what it is. What must never happen is a model with
          # no provenance answering as though it had some.
          card = body["model"]
          assert card["kind"] in ("stand-in", "trained"), card
          # The build knows which weights it put in. If the live service reports
          # anything else, something between here and Lambda served a different
          # image, and that must fail loudly rather than pass as "it answered".
          if expected == "stand-in":
              assert card["kind"] == "stand-in", (expected, card)
          elif expected == "trained":
              assert card["kind"] == "trained" and not card["answers_mean_nothing"], \
                  (expected, card)
          else:
              assert card["answers_mean_nothing"], (expected, card)
          if card["answers_mean_nothing"]:
              assert "MEAN NOTHING" in body["caveat"], body
          else:
              assert card["mcc"] and "not advice" in body["caveat"], body
          print(f"live: {rs[0]['call']} {rs[0]['probability_soluble']}, "
                f"{rs[1]['call']} {rs[1]['probability_soluble']}")
          PY

      - name: summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
