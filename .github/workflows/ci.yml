name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check .
      - name: tests
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # target is named explicitly. The Dockerfile already keeps runtime last,
      # but relying on stage order alone is how the sibling project shipped a
      # Lambda image to a smoke test that could never pass.
      - name: build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: solubility:ci
          provenance: false

      - name: it has to stay small
        run: |
          MB=$(docker image inspect solubility:ci --format '{{.Size}}' | awk '{print int($1/1048576)}')
          echo "image: ${MB} MB"
          # onnxruntime instead of torch is the whole point; if this trips,
          # something pulled a framework back in.
          test "$MB" -lt 400

      - name: start it and ask it a real question
        run: |
          set -euo pipefail
          docker run -d --name svc -p 8080:8080 solubility:ci
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/h.json -w '%{http_code}' http://localhost:8080/health || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          if [ "$CODE" != "200" ]; then
            echo "--- container logs ---"; docker logs svc; exit 1
          fi
          cat /tmp/h.json; echo
          python - <<'PY'
          import json, urllib.request
          h = json.load(urllib.request.urlopen("http://localhost:8080/health", timeout=10))
          assert h["status"] == "ok", h
          # The guard that refuses a model the alphabet does not fit has to be
          # live in the image, not only in the test suite.
          assert h["vocabulary_checked_against_model"] is True, h
          assert h["alphabet_size"] == 33, h
          # The image ships the stand-in, so it must say so rather than
          # quoting the trained model's score.
          assert h["model"]["kind"] == "stand-in", h
          assert h["model"]["mcc"] is None, h
          assert "MEAN NOTHING" in h["caveat"], h

          req = urllib.request.Request(
              "http://localhost:8080/predict",
              data=json.dumps({"sequences": ["MKTVRQERLKSIVRILERSKEPVSGAQ"]}).encode(),
              headers={"content-type": "application/json"})
          r = json.load(urllib.request.urlopen(req, timeout=20))["results"][0]
          assert 0.0 <= r["probability_soluble"] <= 1.0, r
          assert r["call"] in ("soluble", "insoluble"), r
          print(f"live: {r['call']} at {r['probability_soluble']}")
          PY
          docker rm -f svc
